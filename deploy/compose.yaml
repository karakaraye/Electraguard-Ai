name: electraguard

x-django-environment: &django-environment
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: ${ELECTRAGUARD_HOST:?Set ELECTRAGUARD_HOST}
  DJANGO_TRUST_PROXY_HTTPS: "true"
  FRONTEND_ORIGIN: https://${ELECTRAGUARD_HOST:?Set ELECTRAGUARD_HOST}
  OBSERVATION_INTAKE_ENABLED: ${OBSERVATION_INTAKE_ENABLED:-false}
  POSTGRES_DB: electraguard
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: electraguard_runtime
  PRIVATE_MEDIA_ROOT: /var/lib/electraguard/media

x-django: &django
  image: electraguard-backend:${ELECTRAGUARD_RELEASE:?Set ELECTRAGUARD_RELEASE}
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  entrypoint: ["/usr/local/bin/electraguard-django"]
  init: true
  networks: [database]
  security_opt: ["no-new-privileges:true"]
  secrets:
    - django_secret
    - source: database_runtime
      target: database_password
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: electraguard
      POSTGRES_USER: electraguard_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/database_bootstrap
    secrets: [database_bootstrap, database_runtime, database_migrator]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-electraguard.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "electraguard_bootstrap", "-d", "electraguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *django
    profiles: [maintenance]
    environment:
      <<: *django-environment
      POSTGRES_USER: electraguard_migrator
    secrets:
      - django_secret
      - source: database_migrator
        target: database_password
    command: ["python", "manage.py", "migrate", "--noinput"]

  backend:
    <<: *django
    environment: *django-environment
    volumes:
      - private-media:/var/lib/electraguard/media
    networks: [api, database]
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - >-
        python manage.py migrate --check &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --workers 2 --threads 4 --timeout 60 --worker-tmp-dir /dev/shm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os;
          from urllib.request import Request, urlopen;
          host = os.environ["DJANGO_ALLOWED_HOSTS"];
          urlopen(Request("http://127.0.0.1:8000/health/ready",
          headers={"Host": host, "X-Forwarded-Proto": "https"}), timeout=3).close()
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *django
    profiles: [triage]
    environment: *django-environment
    volumes:
      - private-media:/var/lib/electraguard/media
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - python manage.py migrate --check && exec python manage.py run_triage

  frontend:
    image: electraguard-frontend:${ELECTRAGUARD_RELEASE:?Set ELECTRAGUARD_RELEASE}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [web]

  gateway:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    environment:
      ELECTRAGUARD_HOST: ${ELECTRAGUARD_HOST:?Set ELECTRAGUARD_HOST}
      NGINX_ENVSUBST_FILTER: ^ELECTRAGUARD_HOST$
    ports:
      - "${ELECTRAGUARD_BIND_IP:-127.0.0.1}:443:8443"
    volumes:
      - ./gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${ELECTRAGUARD_TLS_DIR:?Set ELECTRAGUARD_TLS_DIR}:/tls:ro
    networks: [edge, web, api]
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

networks:
  edge: {}
  web:
    internal: true
  api:
    internal: true
  database:
    internal: true

volumes:
  postgres-data:
  private-media:

secrets:
  django_secret:
    file: ${ELECTRAGUARD_SECRET_DIR:?Set ELECTRAGUARD_SECRET_DIR}/django
  database_bootstrap:
    file: ${ELECTRAGUARD_SECRET_DIR:?Set ELECTRAGUARD_SECRET_DIR}/postgres-bootstrap
  database_migrator:
    file: ${ELECTRAGUARD_SECRET_DIR:?Set ELECTRAGUARD_SECRET_DIR}/postgres-migrator
  database_runtime:
    file: ${ELECTRAGUARD_SECRET_DIR:?Set ELECTRAGUARD_SECRET_DIR}/postgres-runtime
