user nginx;
worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    # Docker's container resolver follows a recreated app instance.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8443 ssl;
        ssl_certificate /etc/track5/tls/fullchain.pem;
        ssl_certificate_key /etc/track5/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16k;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;

        location /static/ {
            alias /app/staticfiles/;
            autoindex off;
        }

        location / {
            set $track5_backend app:8000;
            proxy_pass http://$track5_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
        }
    }
}
