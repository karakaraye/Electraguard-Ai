name: Verify ElectraGuard

on:
  pull_request:
  push:
    branches:
      - main
      - work
      - production-readiness

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: electraguard_ci
          POSTGRES_USER: electraguard_ci
          POSTGRES_PASSWORD: disposable-ci-database
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U electraguard_ci -d electraguard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_DB: electraguard_ci
      POSTGRES_USER: electraguard_ci
      POSTGRES_PASSWORD: disposable-ci-database
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Configure the isolated test application
        env:
          DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          printf 'POSTGRES_PORT=%s\n' "$DATABASE_PORT" >> "$GITHUB_ENV"
      - name: Verify clean migration and schema consistency
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py makemigrations --check --dry-run
      - name: Run the PostgreSQL-backed suite
        run: python backend/manage.py test accounts reports config
      - name: Check production Django settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: electraguard.example
          FRONTEND_ORIGIN: https://electraguard.example
        run: python backend/manage.py check --deploy

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
