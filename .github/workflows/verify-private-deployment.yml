name: Verify private deployment

on:
  workflow_dispatch:
  push:
    branches: [production-readiness]
    paths:
      - "deploy/**"
      - ".github/workflows/verify-private-deployment.yml"

concurrency:
  group: private-deployment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tls-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRAGUARD_RELEASE: ${{ github.sha }}
      ELECTRAGUARD_HOST: electraguard.test
      OBSERVATION_INTAKE_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          tls_dir="$(mktemp -d)"
          for secret_name in django postgres-bootstrap postgres-migrator postgres-runtime; do
            openssl rand -hex 48 > "$secret_dir/$secret_name"
            chmod 0444 "$secret_dir/$secret_name"
          done
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 \
            -subj "/CN=$ELECTRAGUARD_HOST" -addext "subjectAltName=DNS:$ELECTRAGUARD_HOST" \
            -keyout "$tls_dir/privkey.pem" -out "$tls_dir/fullchain.pem"
          printf 'ELECTRAGUARD_SECRET_DIR=%s\nELECTRAGUARD_TLS_DIR=%s\n' "$secret_dir" "$tls_dir" >> "$GITHUB_ENV"
      - name: Build, migrate and start
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml --profile maintenance build backend frontend
          docker compose -f deploy/compose.yaml up -d --wait postgres
          docker compose -f deploy/compose.yaml --profile maintenance run --rm migrate
          docker compose -f deploy/compose.yaml up -d --wait backend frontend gateway
      - name: Check HTTPS and origin isolation
        shell: bash
        run: |
          set -euo pipefail
          origin="https://$ELECTRAGUARD_HOST"
          tls=(--cacert "$ELECTRAGUARD_TLS_DIR/fullchain.pem" --resolve "$ELECTRAGUARD_HOST:443:127.0.0.1")
          page="$(mktemp)"
          curl "${tls[@]}" --fail --silent --show-error --retry 8 --retry-all-errors -o "$page" "$origin/sign-in"
          grep -Fq 'Sign in' "$page"
          headers="$(mktemp)"
          curl "${tls[@]}" --fail --silent --show-error -D "$headers" -o /dev/null "$origin/api/auth/csrf"
          grep -iq '^strict-transport-security:' "$headers"
          grep -iq '^set-cookie: csrftoken=.*httponly.*secure' "$headers"
          for origin_port in 3000 5432 8000 8081; do
            if timeout 2 bash -c "echo >/dev/tcp/127.0.0.1/$origin_port" 2>/dev/null; then
              printf 'Unexpected exposed origin port %s\n' "$origin_port" >&2
              exit 1
            fi
          done
      - name: Verify encrypted backup and restore
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          export GNUPGHOME="$scratch/gnupg"
          mkdir -m 0700 "$GNUPGHOME" "$scratch/bin"
          cat > "$scratch/bin/pg_dump" <<'RUN_DUMP'
          #!/usr/bin/env bash
          exec docker compose -f deploy/compose.yaml exec -T postgres pg_dump --username=electraguard_bootstrap "$@"
          RUN_DUMP
          chmod 0700 "$scratch/bin/pg_dump"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'ElectraGuard backup check <backup@qa.example>' default default 1d
          recipient="$(gpg --batch --with-colons --fingerprint backup@qa.example |
            awk -F: '$1 == "fpr" && !seen++ { print $10 }')"
          PATH="$scratch/bin:$PATH" bash deploy/backup-encrypted.sh electraguard "$recipient" "$scratch/backup.gpg"
          gpg --batch --output "$scratch/restore.dump" --decrypt "$scratch/backup.gpg"
          db=(docker compose -f deploy/compose.yaml exec -T postgres)
          "${db[@]}" createdb --username=electraguard_bootstrap electraguard_recovery_ci
          "${db[@]}" pg_restore --username=electraguard_bootstrap --exit-on-error --no-owner --no-privileges \
            --dbname=electraguard_recovery_ci < "$scratch/restore.dump"
          query='SELECT count(*) FROM django_migrations;'
          expected="$("${db[@]}" psql -U electraguard_bootstrap -d electraguard -Atqc "$query")"
          restored="$("${db[@]}" psql -U electraguard_bootstrap -d electraguard_recovery_ci -Atqc "$query")"
          test "$expected" -gt 0
          test "$expected" = "$restored"
      - name: Stop isolated runtime
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
