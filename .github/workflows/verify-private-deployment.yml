name: Verify private deployment

on:
  workflow_dispatch:
  push:
    branches: [production-readiness]
    paths:
      - "deploy/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/verify-core.cjs"
      - "tests/fixtures/**"
      - ".github/workflows/verify-private-deployment.yml"

concurrency:
  group: private-deployment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tls-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRAGUARD_RELEASE: ${{ github.sha }}
      ROLLBACK_BASELINE: 46562d47886e9a06cabe6f040dce291d78b45047
      ELECTRAGUARD_HOST: localhost
      COMPOSE_PROJECT_NAME: electraguard-acceptance
      OBSERVATION_INTAKE_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ROLLBACK_BASELINE }}
          path: .local/rollback-baseline
          persist-credentials: false
      - name: Configure isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          tls_dir="$(mktemp -d)"
          for secret_name in django postgres-bootstrap postgres-migrator postgres-runtime; do
            openssl rand -hex 48 > "$secret_dir/$secret_name"
            chmod 0444 "$secret_dir/$secret_name"
          done
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 \
            -subj "/CN=$ELECTRAGUARD_HOST" -addext "subjectAltName=DNS:$ELECTRAGUARD_HOST" \
            -keyout "$tls_dir/privkey.pem" -out "$tls_dir/fullchain.pem"
          printf 'ELECTRAGUARD_SECRET_DIR=%s\nELECTRAGUARD_TLS_DIR=%s\n' "$secret_dir" "$tls_dir" >> "$GITHUB_ENV"
      - name: Build, migrate and start
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml --profile maintenance build backend frontend
          docker compose -f deploy/compose.yaml up -d --wait postgres
          docker compose -f deploy/compose.yaml --profile maintenance run --rm migrate
          docker compose -f deploy/compose.yaml up -d --wait backend frontend gateway
      - name: Check HTTPS and origin isolation
        shell: bash
        run: |
          set -euo pipefail
          origin="https://$ELECTRAGUARD_HOST"
          tls=(--cacert "$ELECTRAGUARD_TLS_DIR/fullchain.pem" --resolve "$ELECTRAGUARD_HOST:443:127.0.0.1")
          page="$(mktemp)"
          curl "${tls[@]}" --fail --silent --show-error --retry 8 --retry-all-errors -o "$page" "$origin/sign-in"
          grep -Fq 'Sign in' "$page"
          headers="$(mktemp)"
          curl "${tls[@]}" --fail --silent --show-error -D "$headers" -o /dev/null "$origin/api/auth/csrf"
          grep -iq '^strict-transport-security:' "$headers"
          grep -iq '^set-cookie: csrftoken=.*httponly.*secure' "$headers"
          for origin_port in 3000 5432 8000 8081; do
            if timeout 2 bash -c "echo >/dev/tcp/127.0.0.1/$origin_port" 2>/dev/null; then
              printf 'Unexpected exposed origin port %s\n' "$origin_port" >&2
              exit 1
            fi
          done
      - name: Verify all three roles through the Docker HTTPS gateway
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/compose.yaml)
          export OBSERVATION_INTAKE_ENABLED=true
          "${compose[@]}" up -d --wait backend
          container="$("${compose[@]}" ps -q backend)"
          export QA_COMPOSE_PROJECT="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$container")"
          test "$QA_COMPOSE_PROJECT" = electraguard-acceptance
          fixture_env=(-e QA_COMPOSE_PROJECT)
          for role in OBSERVER SECOND_OBSERVER REVIEWER SECOND_REVIEWER ADMINISTRATOR; do
            variable="QA_${role}_PASSWORD"
            password="$(openssl rand -hex 24)"
            printf '::add-mask::%s\n' "$password"
            export "$variable=$password"
            fixture_env+=(-e "$variable")
          done
          unset password
          "${compose[@]}" exec -T "${fixture_env[@]}" backend /usr/local/bin/electraguard-django \
            python manage.py shell < tests/fixtures/provision_browser_accounts.py
          scratch="$(mktemp -d)"
          npm install --prefix "$scratch" --ignore-scripts --no-save playwright@1.62.1
          export NODE_PATH="$scratch/node_modules"
          if command -v google-chrome >/dev/null; then
            export QA_CHROMIUM_PATH="$(command -v google-chrome)"
          else
            "$scratch/node_modules/.bin/playwright" install chromium
          fi
          export QA_FRONTEND_ORIGIN="https://$ELECTRAGUARD_HOST"
          export NODE_EXTRA_CA_CERTS="$ELECTRAGUARD_TLS_DIR/fullchain.pem"
          export QA_CHROMIUM_TLS_PIN="$(openssl x509 -in "$NODE_EXTRA_CA_CERTS" -pubkey -noout |
            openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl enc -base64)"
          export QA_EVIDENCE_PATH="$scratch/evidence.png"
          "${compose[@]}" exec -T backend python - > "$QA_EVIDENCE_PATH" <<'PNG'
          from io import BytesIO
          import sys
          from PIL import Image, PngImagePlugin

          image = Image.new("RGB", (16, 16), "white")
          def png(note):
              buf = BytesIO()
              metadata = PngImagePlugin.PngInfo()
              metadata.add_text("test", note)
              image.save(buf, format="PNG", pnginfo=metadata)
              return buf.getvalue()

          limit = 2 * 1024 * 1024
          data = png("x" * (limit - len(png(""))))
          assert len(data) == limit
          sys.stdout.buffer.write(data)
          PNG
          node scripts/verify-core.cjs
      - name: Verify encrypted backup and restore
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          export GNUPGHOME="$scratch/gnupg"
          mkdir -m 0700 "$GNUPGHOME" "$scratch/bin"
          cat > "$scratch/bin/pg_dump" <<'RUN_DUMP'
          #!/usr/bin/env bash
          exec docker compose -f deploy/compose.yaml exec -T postgres pg_dump --username=electraguard_bootstrap "$@"
          RUN_DUMP
          chmod 0700 "$scratch/bin/pg_dump"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'ElectraGuard backup check <backup@qa.example>' default default 1d
          recipient="$(gpg --batch --with-colons --fingerprint backup@qa.example |
            awk -F: '$1 == "fpr" && !seen++ { print $10 }')"
          PATH="$scratch/bin:$PATH" bash deploy/backup-encrypted.sh electraguard "$recipient" "$scratch/backup.gpg"
          gpg --batch --output "$scratch/restore.dump" --decrypt "$scratch/backup.gpg"
          db=(docker compose -f deploy/compose.yaml exec -T postgres)
          "${db[@]}" createdb --username=electraguard_bootstrap electraguard_recovery_ci
          "${db[@]}" pg_restore --username=electraguard_bootstrap --exit-on-error --no-owner --no-privileges \
            --dbname=electraguard_recovery_ci < "$scratch/restore.dump"
          query=tests/fixtures/restore_acceptance.sql
          "${db[@]}" psql -X -U electraguard_bootstrap -d electraguard -Atq -v ON_ERROR_STOP=1 \
            < "$query" > "$scratch/source.manifest"
          "${db[@]}" psql -X -U electraguard_bootstrap -d electraguard_recovery_ci -Atq -v ON_ERROR_STOP=1 \
            < "$query" > "$scratch/restore.manifest"
          test "$(grep -cx t "$scratch/source.manifest")" = 3
          cmp -s "$scratch/source.manifest" "$scratch/restore.manifest"
          printf '%s\n' 'Encrypted restore matched 2 closed cases, 2 maximum-size images, and their audit history.'
          restored_db=electraguard_recovery_ci
          "${db[@]}" psql -X -U electraguard_bootstrap -d "$restored_db" -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CONNECT ON DATABASE electraguard_recovery_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE electraguard_recovery_ci TO electraguard_runtime;
          GRANT SELECT ON accounts_user TO electraguard_runtime;
          GRANT SELECT, DELETE ON django_session TO electraguard_runtime;
          SQL
          source_sessions_sql='SELECT count(*) FROM django_session;'
          source_before="$("${db[@]}" psql -X -U electraguard_bootstrap -d electraguard -Atqc "$source_sessions_sql")"
          test "$source_before" -gt 0
          docker compose -f deploy/compose.yaml run --rm --no-deps -T \
            -e POSTGRES_DB="$restored_db" -e OBSERVATION_INTAKE_ENABLED=false backend \
            python manage.py shell < tests/fixtures/verify_restored_session.py
          source_after="$("${db[@]}" psql -X -U electraguard_bootstrap -d electraguard -Atqc "$source_sessions_sql")"
          test "$source_before" = "$source_after"
      - name: Rehearse application image rollback with intake paused
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/compose.yaml)
          source=(docker compose -f deploy/compose.yaml exec -T postgres
            psql -X -U electraguard_bootstrap -d electraguard -Atq -v ON_ERROR_STOP=1)
          scratch="$(mktemp -d)"
          query=tests/fixtures/restore_acceptance.sql
          "${source[@]}" < "$query" > "$scratch/before"
          test "$(grep -cx t "$scratch/before")" = 3
          candidate="$ELECTRAGUARD_RELEASE"
          baseline=.local/rollback-baseline
          for service in backend frontend; do
            docker build -f "$baseline/deploy/$service.Dockerfile" \
              -t "electraguard-$service:$ROLLBACK_BASELINE" "$baseline"
          done
          export OBSERVATION_INTAKE_ENABLED=false
          for release in "$ROLLBACK_BASELINE" "$candidate"; do
            export ELECTRAGUARD_RELEASE="$release"
            "${compose[@]}" up -d --wait --no-build backend frontend gateway
            for service in backend frontend; do
              container="$("${compose[@]}" ps -q "$service")"
              test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "electraguard-$service:$release"
            done
            curl --cacert "$ELECTRAGUARD_TLS_DIR/fullchain.pem" \
              --resolve "$ELECTRAGUARD_HOST:443:127.0.0.1" --fail --silent --show-error \
              --retry 8 --retry-delay 1 --retry-all-errors -o "$scratch/sign-in.html" \
              "https://$ELECTRAGUARD_HOST/sign-in"
            grep -Fq 'Sign in' "$scratch/sign-in.html"
            "${compose[@]}" exec -T backend /usr/local/bin/electraguard-django python manage.py shell \
              -c 'from django.conf import settings; assert not settings.OBSERVATION_INTAKE_ENABLED'
            "${source[@]}" < "$query" > "$scratch/after"
            cmp -s "$scratch/before" "$scratch/after"
          done
          printf '%s\n' 'Previous and candidate images served HTTPS with intake paused and preserved the database.'
      - name: Stop isolated runtime
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
